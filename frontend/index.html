<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Finance Core - AI 기반 회계 자동화 플랫폼</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <script>
      // No-flash theme init — reads persisted preference before first paint.
      // Default is LIGHT unless the user has explicitly opted into dark mode.
      (function () {
        try {
          var raw = localStorage.getItem('theme-storage');
          var theme = raw ? JSON.parse(raw)?.state?.theme : null;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage unavailable or malformed — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
